name: Update InviZible blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download and merge lists
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt \
            -o hagezi.txt

          curl -L --fail \
            https://raw.githubusercontent.com/froggeric/DNS-blocklists/main/NoYouTubeAdsDNS \
            -o youtube.txt

          {
            echo "# InviZible Pro - HaGeZi + YouTube"
            echo "# Generated automatically"
            cat hagezi.txt
            cat youtube.txt
          } | grep -E '^\*\.[A-Za-z0-9.-]+$|^[A-Za-z0-9.-]+\.[A-Za-z]{2,}$' \
            | sed 's/^\*\.//' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u > blocklist.txt

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt
          git diff --cached --quiet || git commit -m "Update blocklist"
          git push
